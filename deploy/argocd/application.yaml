# Main workload Application: renders the Helm chart under deploy/helm/policy-hub.
#   kubectl apply -f deploy/argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policy-hub
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: policyhub
  source:
    repoURL: https://github.com/project-construct-x/policy-hub
    targetRevision: main
    path: deploy/helm/policy-hub
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: policyhub
  # The database password is generated by the chart on the FIRST install only.
  # ArgoCD's repo-server renders without cluster access, so the Helm `lookup`
  # in templates/secrets.yaml cannot see the existing Secret and produces a
  # fresh random value on every render. Ignoring that field — and respecting
  # the ignore during sync — is what keeps the password stable instead of
  # rotating (and breaking the Postgres PVC) on every reconcile.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: policy-hub-secrets
      jsonPointers:
        - /data/db-password
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
