# ---------------------------------------------------------------------------
# Policy Hub — Helm values
# ---------------------------------------------------------------------------

# Optional overrides for resource names. By default names derive from the
# release name (e.g. "policy-hub-backend").
nameOverride: ""
fullnameOverride: ""
# Pull secret(s) for the private ghcr.io images, referenced here only by name.
# See `ghcrCreds` below for how the Secret itself gets created.
imagePullSecrets:
  - name: ghcr-creds
# Creates the ghcr-creds Secret from these values when `create: true`. Leave
# create: false (default) and set username/password as ArgoCD Application
# parameter overrides (Application -> Parameters in the UI) instead of
# committing them here — see deploy/secrets/README.md.
ghcrCreds:
  create: false
  name: ghcr-creds
  registry: ghcr.io
  username: ""
  password: ""
# ---------------------------------------------------------------------------
# Backend (Spring Boot)
# ---------------------------------------------------------------------------
backend:
  image:
    repository: ghcr.io/project-construct-x/policy-hub-backend
    # Tag is maintained by the CI commit-back step; "latest" is only a placeholder.
    tag: 3c7b319
    pullPolicy: IfNotPresent
  replicaCount: 1
  # Spring profile driving application-prod.yaml.
  springProfile: prod
  service:
    port: 80
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
# ---------------------------------------------------------------------------
# Frontend (Angular served by nginx)
# ---------------------------------------------------------------------------
frontend:
  image:
    repository: ghcr.io/project-construct-x/policy-hub-frontend
    tag: 3c7b319
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
# ---------------------------------------------------------------------------
# Database connection (non-secret parts). The password comes from the Secret
# referenced under `secret.name` below.
# ---------------------------------------------------------------------------
database:
  name: policyhub
  username: policyhub
# ---------------------------------------------------------------------------
# TEMPORARY — HTTP Basic Auth for the backend. NOT PRODUCTION-READY.
# Placeholder until the real Construct-X auth mechanism is decided. The
# password is plaintext in git ON PURPOSE: it is a throwaway staging
# credential, and the whole block is meant to be deleted rather than secured.
# templates/secret-basic-auth.yaml documents how to remove this in one go.
# ---------------------------------------------------------------------------
auth:
  enabled: true
  username: admin
  password: ph-staging-8Qk2vTn4
  secretName: policy-hub-basic-auth
  secretKey: security-user-password
# Secret holding the database password. The chart owns and creates it: on the
# first install the password is generated (randAlphaNum 32), every later render
# re-uses the value already in the cluster — there is no automatic rotation.
# See templates/secrets.yaml and deploy/secrets/README.md.
# Set `dbPassword` only to force a specific password (restore / disaster
# recovery), e.g. as an ArgoCD Application parameter override; leave it empty
# otherwise. NOT PRODUCTION-READY: Secrets are base64-encoded, not encrypted.
secret:
  name: policy-hub-secrets
  create: true
  dbPassword: ""
  keys:
    dbPassword: db-password
# ---------------------------------------------------------------------------
# In-cluster PostgreSQL (self-contained StatefulSet, official image).
# Set enabled: false to use an external/managed database instead — then point
# `database` at it and drop the postgres templates from the sync.
# ---------------------------------------------------------------------------
postgresql:
  enabled: true
  image: postgres:16-alpine
  storage: 5Gi
  # Leave empty to use the cluster's default StorageClass.
  storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
# ---------------------------------------------------------------------------
# Ingress (ingress-nginx + cert-manager)
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  host: policy-hub.staging.construct-x.net
  # cert-manager ClusterIssuer that signs the TLS cert.
  # used in your staging cluster.
  clusterIssuer: letsencrypt-staging
  tls: true
  # Extra annotations merged onto the Ingress (e.g. body size, rewrite rules).
  annotations: {}
