<article class="cc" *transloco="let t">
  <span class="cc__bar" aria-hidden="true"></span>
  <span class="material-icons cc__icon" aria-hidden="true">{{ metadata().icon }}</span>
  <div class="cc__body">
    <h3 class="cc__title">{{ t(metadata().labelKey) }}</h3>
    <p class="cc__summary">{{ summary() }}</p>
    @if (list(); as chipList) {
      <ul class="cc__list" [attr.aria-label]="t(chipList.labelKey)" [attr.data-cy]="chipList.cy">
        @for (item of chipList.items; track $index) {
          <li class="cc__chip">
            @if (item.kindKey) {
              <span class="cc__chip-kind">{{ t(item.kindKey) }}:</span>
            }
            <span>{{ item.text }}</span>
          </li>
        }
      </ul>
    }
  </div>
</article>
